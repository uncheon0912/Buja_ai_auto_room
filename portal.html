<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🌟 VIP 고객 성과 포털</title>
<style>
  :root{
    --bg:#071021; --card:rgba(15,23,42,0.86); --line:rgba(56,189,248,0.22);
    --text:#f1f5f9; --muted:#94a3b8; --accent:#38bdf8; --gold:#e6c46a; --ok:#22c55e; --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100dvh; color:var(--text);
    background:radial-gradient(circle at 15% 10%, #10254a 0%, #071021 55%, #040812 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    padding:22px 16px 48px;
  }
  .wrap{max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:18px}
  .hero{
    background:linear-gradient(135deg, rgba(12,74,110,0.88), rgba(15,23,42,0.92));
    border:1px solid rgba(56,189,248,0.38); border-radius:22px; padding:24px 26px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .hero .kicker{font-size:11px; font-weight:800; letter-spacing:.12em; color:var(--gold); text-transform:uppercase}
  .hero h1{margin:4px 0 6px; font-size:24px; font-weight:900}
  .hero p{margin:0; font-size:13px; color:#cbd5e1}
  .badge{display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:800; background:rgba(56,189,248,0.16); color:#7dd3fc; border:1px solid rgba(56,189,248,0.35)}
  .badge.ok{background:rgba(34,197,94,0.18); color:#86efac; border-color:rgba(34,197,94,0.45)}
  .badge.warn{background:rgba(245,158,11,0.18); color:#fde68a; border-color:rgba(245,158,11,0.45)}
  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
  @media (max-width:780px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
  .kpi{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px;
  }
  .kpi .lbl{font-size:11.8px; color:var(--muted); font-weight:700}
  .kpi .val{font-size:24px; font-weight:900; color:var(--accent); margin:5px 0 3px}
  .kpi .sub{font-size:11.2px; color:#cbd5e1}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 22px;
  }
  .card h2{margin:0 0 12px; font-size:16px; font-weight:800; color:#e0f2fe; display:flex; justify-content:space-between; align-items:center}
  .prog-track{height:12px; background:rgba(255,255,255,0.08); border-radius:999px; overflow:hidden; margin-top:8px}
  .prog-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,#0284c7,#38bdf8,#22c55e)}
  .deliv-list, .lead-list{display:flex; flex-direction:column; gap:10px}
  .item{
    background:rgba(30,41,59,0.72); border:1px solid rgba(56,189,248,0.18); border-radius:14px; padding:14px 16px;
  }
  .item-top{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px}
  .item-body{font-size:13px; color:#e2e8f0; line-height:1.6; white-space:pre-wrap}
  .fb-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap}
  .fb-row input{
    flex:1; min-width:180px; background:#0f172a; border:1px solid var(--line); color:#fff;
    border-radius:10px; padding:8px 11px; font:inherit; font-size:12.5px; outline:none;
  }
  .btn{
    border:0; border-radius:10px; padding:8px 14px; font:inherit; font-size:12.5px; font-weight:800; cursor:pointer; color:#fff;
    background:linear-gradient(135deg,#0284c7,#0ea5e9);
  }
  .btn.ok{background:linear-gradient(135deg,#15803d,#22c55e)}
  .btn.warn{background:linear-gradient(135deg,#d97706,#f59e0b)}
  table{width:100%; border-collapse:collapse; font-size:12.6px}
  th,td{padding:9px 10px; border-bottom:1px solid rgba(56,189,248,0.14); text-align:left}
  th{color:#7dd3fc; font-weight:800}
  .chart-bars{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:8px}
  @media (max-width:640px){.chart-bars{grid-template-columns:1fr}}
  .cbar{background:rgba(30,41,59,0.72); border-radius:12px; padding:12px 14px}
  .empty{text-align:center; padding:32px; color:var(--muted); font-size:13.5px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="card empty">🌟 VIP 고객 포털 데이터를 불러오는 중입니다…</div>
</div>
<script>
(function(){
  'use strict';
  var params = new URLSearchParams(location.search);
  var token = (params.get('token') || '').trim();
  var app = document.getElementById('app');

  function esc(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function won(n){ return Math.round(Number(n || 0)).toLocaleString('ko-KR') + '원'; }
  function kst(iso){
    try { return new Date(iso).toLocaleString('ko-KR', {timeZone:'Asia/Seoul', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'}); }
    catch(e){ return ''; }
  }

  if (!token){
    app.innerHTML = '<div class="card empty">🔒 전용 VIP 포털 링크(<code>?token=...</code>)로 접속해 주세요.</div>';
    return;
  }

  function load(){
    fetch('/api/portal/' + encodeURIComponent(token), { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || !d.ok) throw new Error((d && d.message) || '포털을 열 수 없습니다.');
        render(d);
      })
      .catch(function(err){
        app.innerHTML = '<div class="card empty">⚠️ ' + esc(err.message) + '</div>';
      });
  }

  function render(d){
    var ag = d.agency || {};
    var c = d.client || {};
    var leads = d.leads || [];
    var delivs = d.deliverables || [];
    var latestSns = (d.sns_reports && d.sns_reports[0] && d.sns_reports[0].data) || null;
    var contracts = d.contracts || [];

    var pct = c.db_goal > 0 ? Math.min(100, Math.round((c.db_count / c.db_goal) * 100)) : 0;
    var budget = Number((latestSns && latestSns.marketingBudget) || c.monthly_fee || 0);
    var cpa = c.db_count > 0 && budget > 0 ? Math.round(budget / c.db_count) : 0;
    var estSales = latestSns ? Number(latestSns.closeCount || 0) * Number(latestSns.avgDealValue || 0) : 0;
    var roas = budget > 0 && estSales > 0 ? (estSales / budget).toFixed(1) + '배' : '-';

    var blogScore = latestSns ? Number(latestSns.blogScore || 0) : 0;
    var reelsScore = latestSns ? Number(latestSns.reelsScore || 0) : 0;
    var funnelScore = latestSns ? Number(latestSns.funnelScore || 0) : 0;

    app.innerHTML =
      '<section class="hero">' +
        '<div>' +
          '<div class="kicker">✦ ' + esc(ag.company || '미담공장') + ' × VIP CLIENT LIVE PORTAL</div>' +
          '<h1>' + esc(c.name) + ' 실시간 마케팅 성과 포털</h1>' +
          '<p>' + esc(c.industry) + ' · 진행 서비스: ' + esc((c.services || []).join(', ') || '맞춤 마케팅') + '</p>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">' +
          '<span class="badge ok">● 실시간 동기화 중</span>' +
          '<span style="font-size:12px;color:#cbd5e1">담당 대행사: ' + esc(ag.company || '미담공장') + (ag.phone ? ' · ' + esc(ag.phone) : '') + '</span>' +
        '</div>' +
      '</section>' +

      '<section class="kpi-grid">' +
        '<div class="kpi"><div class="lbl">🎯 누적 수집 DB (문의)</div><div class="val">' + Number(c.db_count || 0) + '건</div><div class="sub">목표 ' + Number(c.db_goal || 0) + '건 대비 ' + pct + '%</div></div>' +
        '<div class="kpi"><div class="lbl">💰 손님 1명 문의 비용 (CPA)</div><div class="val">' + (cpa ? won(cpa) : '-') + '</div><div class="sub">투입 마케팅비 기준</div></div>' +
        '<div class="kpi"><div class="lbl">📈 투자 대비 매출 (ROAS)</div><div class="val" style="color:#22c55e">' + esc(roas) + '</div><div class="sub">' + (estSales ? '예상 매출 ' + won(estSales) : 'SNS 보고서 연동') + '</div></div>' +
        '<div class="kpi"><div class="lbl">📋 검수 대기 콘텐츠</div><div class="val" style="color:#f59e0b">' + delivs.filter(function(x){ return x.status === '검수대기'; }).length + '건</div><div class="sub">아래에서 원클릭 승인 가능</div></div>' +
      '</section>' +

      '<section class="card">' +
        '<h2><span>📊 쉬운 KPI 달성 현황 &amp; 채널 건강 점수</span><span class="badge">DB 목표 달성률 ' + pct + '%</span></h2>' +
        '<div class="prog-track"><div class="prog-fill" style="width:' + pct + '%"></div></div>' +
        (latestSns ? (
          '<div class="chart-bars">' +
            '<div class="cbar"><div style="display:flex;justify-content:space-between;font-size:12px"><span>🟢 네이버 블로그 SEO</span><b>' + blogScore + '점</b></div><div class="prog-track"><div class="prog-fill" style="width:' + blogScore + '%"></div></div></div>' +
            '<div class="cbar"><div style="display:flex;justify-content:space-between;font-size:12px"><span>🩷 인스타 릴스 확산</span><b>' + reelsScore + '점</b></div><div class="prog-track"><div class="prog-fill" style="width:' + reelsScore + '%;background:linear-gradient(90deg,#db2777,#f472b6)"></div></div></div>' +
            '<div class="cbar"><div style="display:flex;justify-content:space-between;font-size:12px"><span>🎯 퍼널 · DB 전환</span><b>' + funnelScore + '점</b></div><div class="prog-track"><div class="prog-fill" style="width:' + funnelScore + '%;background:linear-gradient(90deg,#16a34a,#4ade80)"></div></div></div>' +
          '</div>'
        ) : '<p style="font-size:12.5px;color:var(--muted);margin:10px 0 0">최신 월간 SNS 분석 보고서가 등록되면 채널별 점수가 여기에 표시됩니다.</p>') +
      '</section>' +

      '<section class="card">' +
        '<h2><span>✅ 발행 예정 콘텐츠 검수 · 원클릭 승인함</span><span class="badge">' + delivs.length + '건</span></h2>' +
        '<div class="deliv-list">' +
          (delivs.length ? delivs.map(function(it){
            var bCls = (it.status === '승인완료' || it.status === '예약확정' || it.status === '발행완료') ? 'ok' : (it.status === '수정요청' ? 'warn' : '');
            var stLbl = it.status === '예약확정' ? '✅ 승인 · 자동예약 확정' : (it.status === '발행완료' ? '🚀 발행 완료' : it.status);
            return '<div class="item">' +
              '<div class="item-top">' +
                '<div><span class="badge">' + esc(it.channel) + '</span> <b style="margin-left:6px;font-size:14px">' + esc(it.title) + '</b></div>' +
                '<div style="display:flex;gap:6px;align-items:center">' +
                  (it.scheduled_date ? '<span style="font-size:11.5px;color:var(--muted)">발행예정 ' + esc(it.scheduled_date) + '</span>' : '') +
                  '<span class="badge ' + bCls + '">' + esc(stLbl) + '</span>' +
                '</div>' +
              '</div>' +
              '<div class="item-body">' + esc(it.preview_text || '') + '</div>' +
              (it.client_feedback ? '<div style="margin-top:8px;font-size:12px;color:#fde68a">💬 남긴 피드백: ' + esc(it.client_feedback) + '</div>' : '') +
              '<div class="fb-row">' +
                '<input type="text" id="fb-' + it.id + '" placeholder="수정 요청이나 코멘트가 있으면 입력하세요 (선택)">' +
                '<button type="button" class="btn ok" data-act="승인완료" data-did="' + it.id + '">✅ 발행 승인</button>' +
                '<button type="button" class="btn warn" data-act="수정요청" data-did="' + it.id + '">✏️ 수정 요청</button>' +
              '</div>' +
            '</div>';
          }).join('') : '<div class="empty">현재 검수 대기 중인 콘텐츠가 없습니다.</div>') +
        '</div>' +
      '</section>' +

      '<section class="card">' +
        '<h2><span>🎯 실시간 유입 고객 DB 리스트</span><span class="badge ok">최근 ' + leads.length + '건</span></h2>' +
        (leads.length ? '<table><thead><tr><th>유입 시각</th><th>문의자</th><th>연락처</th><th>유입 경로</th><th>문의 내용</th></tr></thead><tbody>' +
          leads.map(function(l){
            return '<tr><td>' + esc(kst(l.created_at)) + '</td><td><b>' + esc(l.lead_name) + '</b></td><td>' + esc(l.lead_phone || '-') + '</td><td>' + esc(l.source) + '</td><td>' + esc(l.lead_note || '-') + '</td></tr>';
          }).join('') + '</tbody></table>'
          : '<div class="empty">퍼널을 통해 실시간 상담 DB가 유입되면 이곳에 즉시 표시됩니다.</div>') +
      '</section>' +

      (contracts.length ? '<section class="card"><h2><span>📄 진행 계약 현황</span></h2><table><thead><tr><th>계약번호</th><th>계약명</th><th>금액</th><th>상태</th></tr></thead><tbody>' +
        contracts.map(function(ct){
          return '<tr><td>' + esc(ct.contract_no) + '</td><td><b>' + esc(ct.title) + '</b></td><td>' + won(ct.total_amount) + '</td><td><span class="badge ok">' + esc(ct.status) + '</span></td></tr>';
        }).join('') + '</tbody></table></section>' : '');

    Array.prototype.forEach.call(app.querySelectorAll('[data-did]'), function(btn){
      btn.addEventListener('click', function(){
        var did = btn.getAttribute('data-did');
        var act = btn.getAttribute('data-act');
        var inp = document.getElementById('fb-' + did);
        btn.disabled = true;
        fetch('/api/portal/' + encodeURIComponent(token) + '/deliverables/' + did, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ status: act, feedback: inp ? inp.value.trim() : '' })
        }).then(function(r){ return r.json(); }).then(function(res){
          if (res && res.ok) load();
        });
      });
    });
  }

  load();
})();
</script>
</body>
</html>
